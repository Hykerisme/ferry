name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: probe/go.mod

      - run: uv sync --frozen
      - run: uv run ruff check src scripts tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
        working-directory: probe

      - name: Bundle cross-compiled probes
        run: uv run python scripts/build_probe.py --bundle

      - name: Build wheel and sdist
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Verify probes are bundled in the wheel
        run: |
          unzip -l dist/*.whl | grep -q 'ferry/_probes/linux-amd64/probe'
          unzip -l dist/*.whl | grep -q 'ferry/_probes/linux-arm64/probe'
          unzip -l dist/*.whl | grep -q 'ferry/_probes/linux-armv7/probe'
          unzip -l dist/*.whl | grep -q 'ferry/_probes/manifest.json'
          unzip -l dist/*.whl | grep -q 'ferry/_probes/platforms.json'

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ferry-tool
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
