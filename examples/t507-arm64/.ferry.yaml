version: 1
project:
  name: t507-demo
targets:
  t507_arm64:
    sync:
      ignore:
        - .git
        - .ferry
        - .private.ferry.yaml
        - .env
        - .venv
        - __pycache__
        - node_modules
    build:
      node: buildvm
      workdir: /work/t507-demo
      out: ./build/out
      before_build:
        - scripts/check-env.sh
      run_build: "cmake -B build -DCMAKE_TOOLCHAIN_FILE=toolchains/t507.cmake && cmake --build build -j"
      after_build:
        - scripts/strip-symbols.sh
    deploy:
      node: target-t507
      transfer_from: build.node
      workdir: /opt/app
      before_deploy:
        - scripts/stop-service.sh
      run_deploy: "echo deploying"
      after_deploy:
        - scripts/install-service.sh
        - scripts/restart.sh
